name: Tests
on:
  workflow_dispatch:
  pull_request:
    branches: [main, 'codex/vyos-*', codex/provider-reliability-maintenance]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - run: go mod download
      - run: go build ./...
      - run: go vet ./...
      - run: python3 -m unittest discover -s .ci -p 'test_*.py' -v
      - run: go test -race -count=1 -cover ./...
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: '1.17.1'
          terraform_wrapper: false
      - run: go generate ./...
      - run: git diff --exit-code

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.20.0
          args: check
