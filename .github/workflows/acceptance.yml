name: Pinned VyOS acceptance
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: '1.17.1'
          terraform_wrapper: false
      - name: Install VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso openssl
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Cache pinned ISO
        uses: actions/cache@v6.1.0
        with:
          path: .ci-cache/*.iso
          key: vyos-iso-438c1139a7e929474e8ca963547c0b10da85569faea4e5e656fc1d1bc3a1e34f
      - name: Run disposable pinned VM acceptance
        run: .ci/acceptance.sh
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vyos-acceptance-${{ github.run_id }}
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
