name: VyOS rolling acceptance
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: '1.17.1'
          terraform_wrapper: false
      - name: Install VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso openssl
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Resolve latest official rolling build
        id: vyos
        run: python3 .ci/vyos_vm.py resolve --output "$RUNNER_TEMP/vyos-build.json" --github-output "$GITHUB_OUTPUT"
      - name: Cache resolved ISO
        uses: actions/cache@v6.1.0
        with:
          path: .ci-cache/*.iso
          key: vyos-iso-${{ steps.vyos.outputs.sha256 }}
      - name: Run disposable rolling VM acceptance
        env:
          VYOS_CI_BUILD: ${{ runner.temp }}/vyos-build.json
        run: .ci/acceptance.sh
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vyos-acceptance-${{ github.run_id }}
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
